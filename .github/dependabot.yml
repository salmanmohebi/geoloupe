# Keep dependencies current with grouped pull requests (one per ecosystem and interval).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: uv
    directory: /
    schedule: {interval: monthly}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: monthly}
    groups:
      web: {patterns: ["*"]}
