name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The command or configuration (YAML), the dataset (a public URL if possible), and the steps in the browser.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console messages
      render: text
  - type: input
    id: version
    attributes:
      label: Versions
      description: "Output of `geoloupe --version`, your Python version and browser"
    validations:
      required: true
