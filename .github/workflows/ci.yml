name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run ruff check src tests scripts examples
      - run: uv run ruff format --check src tests scripts examples
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv sync
      - run: uv run geoloupe demo-data demo --days 200
      - run: uv run geoloupe serve demo/demo.yaml --port 8765 --open-root demo &
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium && npm run build
      - run: timeout 300 bash -c 'until curl -sf http://127.0.0.1:8765/api/health; do sleep 2; done'
      - run: cd frontend && node e2e/smoke.mjs http://127.0.0.1:8765 shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: frontend/shots

  # The gallery reads public data from AWS, Google Cloud and NOAA: an outage there must not make
  # CI red, so this job only reports.
  gallery:
    needs: [python, web]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv sync --all-extras
      - run: uv run geoloupe gallery --port 8766 &
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: timeout 180 bash -c 'until curl -sf http://127.0.0.1:8766/api/health; do sleep 2; done'
      - run: cd frontend && node e2e/gallery.mjs http://127.0.0.1:8766 gallery-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gallery-screenshots
          path: frontend/gallery-shots
