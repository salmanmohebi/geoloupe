[build-system]
requires = ["hatchling>=1.25", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "geoloupe"
dynamic = ["version", "readme"]  # version: src/geoloupe/__init__.py; readme: see below
description = "Interactive, multi-resolution exploration of large scientific and geospatial datasets in the browser."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Salman Mohebi" }]
keywords = ["xarray", "zarr", "netcdf", "climate", "geospatial", "visualization", "tiles", "maplibre"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: JavaScript",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "xarray>=2024.10",
    "zarr>=3.0.8",
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "cftime>=1.6",
    "scipy>=1.11",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Multi-file NetCDF collections (xarray.open_mfdataset) need dask.
dask = ["dask>=2024.8"]
# Remote object storage (s3://, gs://, https://) through fsspec.
remote = ["fsspec>=2024.6", "s3fs>=2024.6", "aiohttp>=3.9"]
# GRIB through cfgrib (the eccodes wheel bundles the C library).
grib = ["cfgrib>=0.9.14", "eccodes>=2.38", "eccodeslib>=2.38; platform_system != \"Windows\""]
# GeoTIFF / Cloud-Optimized GeoTIFF through rioxarray (GDAL).
geotiff = ["rioxarray>=0.17"]
# Station / point observations from Parquet.
stations = ["pyarrow>=16"]
# Vector overlays (GeoJSON, Shapefile, GeoPackage, FlatGeobuf, GeoParquet) through pyogrio + shapely.
vector = ["pyogrio>=0.10", "shapely>=2.0"]
all = ["geoloupe[dask,remote,grib,geotiff,stations,vector]"]

[project.scripts]
geoloupe = "geoloupe.cli:main"

[project.urls]
Homepage = "https://github.com/salmanmohebi/geoloupe"
Documentation = "https://github.com/salmanmohebi/geoloupe#readme"
Issues = "https://github.com/salmanmohebi/geoloupe/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pyarrow>=16",
    "dask>=2024.8",
]

[tool.hatch.version]
path = "src/geoloupe/__init__.py"

# The README for PyPI: relative links and images become absolute GitHub URLs (PyPI cannot
# resolve relative paths); GitHub keeps the plain relative links.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/salmanmohebi/geoloupe/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/salmanmohebi/geoloupe/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/geoloupe"]
# The built web client is shipped inside the package (src/geoloupe/static).
artifacts = ["src/geoloupe/static/**"]

[tool.hatch.build.targets.sdist]
exclude = ["frontend/node_modules", "frontend/dist", "data", "demo", "docs/images"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # zarr v3 warns that some v2-era codecs are not in the v3 spec yet.
    "ignore::zarr.errors.UnstableSpecificationWarning",
    "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
# E501: `ruff format` wraps code; long user-facing strings and regexes stay readable.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # also allow unicode (°, ×, −) in text

[tool.mypy]
python_version = "3.11"
packages = ["geoloupe"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
# notebook-style scripts: a bare expression at the end of a cell displays it
"examples/notebook_*.py" = ["B018", "E402"]
