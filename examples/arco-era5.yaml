# ERA5 hourly (1940–present, 0.25°) read over HTTPS from Google's public ARCO-ERA5 Zarr store:
# no download, no credentials. Opening takes a few seconds; each tile reads one hourly field
# (~1 s over the internet).
#
#   geoloupe serve examples/arco-era5.yaml
title: ARCO-ERA5 (Google Cloud public dataset)
datasets:
  era5:
    title: ERA5 hourly, 0.25° (ARCO-ERA5)
    path: https://storage.googleapis.com/gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
    variables: [2m_temperature, total_precipitation, 10m_u_component_of_wind, 10m_v_component_of_wind]
    # The store's time axis runs 1900–2050; data exists from 1940 to about one week ago.
    time_range: ["1940-01-01", "2026-10-30"]
    attribution: ERA5 © ECMWF / Copernicus Climate Change Service; ARCO-ERA5 by Google Research
