# A Sentinel-2 L2A scene read directly from the public AWS bucket (Cloud-Optimized GeoTIFFs over
# HTTPS; nothing is downloaded). The COGs' internal overviews (20…160 m) are used as resolution
# levels automatically.
#
#   terrascope serve examples/sentinel2.yaml
#
# Scale: Element84 (earth-search) files of processing baseline ≥ 04.00 already have the BOA offset
# applied ("earthsearch:boa_offset_applied": true), so reflectance = DN × 0.0001 with no −0.1 offset,
# although the STAC raster:bands metadata still lists −0.1. Check this property for other scenes.
title: Sentinel-2 L2A · Monte Rosa and Lake Maggiore · 2023-08-07
datasets:
  red:
    title: Sentinel-2 B04 (red, 10 m)
    path: https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/32/T/MR/2023/8/S2A_32TMR_20230807_0_L2A/B04.tif
    decode: {B04: {scale: 0.0001}}
    styles: {B04: {colormap: gray, vmin: 0, vmax: 0.3, units: reflectance}}
    attribution: Contains modified Copernicus Sentinel data 2023 (ESA); COGs by Element84
  nir:
    title: Sentinel-2 B08 (near infrared, 10 m)
    path: https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/32/T/MR/2023/8/S2A_32TMR_20230807_0_L2A/B08.tif
    decode: {B08: {scale: 0.0001}}
    styles: {B08: {colormap: gray, vmin: 0, vmax: 0.5, units: reflectance}}
    attribution: Contains modified Copernicus Sentinel data 2023 (ESA); COGs by Element84
  green:
    title: Sentinel-2 B03 (green, 10 m)
    path: https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/32/T/MR/2023/8/S2A_32TMR_20230807_0_L2A/B03.tif
    decode: {B03: {scale: 0.0001}}
    attribution: Contains modified Copernicus Sentinel data 2023 (ESA); COGs by Element84
  tci:   # a 3-band image: TerraScope adds the true-colour layer "tci:TCI:rgb" itself
    title: Sentinel-2 true colour (TCI, 10 m)
    path: https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/32/T/MR/2023/8/S2A_32TMR_20230807_0_L2A/TCI.tif
    attribution: Contains modified Copernicus Sentinel data 2023 (ESA); COGs by Element84

layers:
  false-colour:
    title: False colour (NIR, red, green) — vegetation in red
    rgb: true
    gamma: 1.3
    vmin: 0
    vmax: 0.45
    sources:
      - {dataset: nir, variable: B08}
      - {dataset: red, variable: B04}
      - {dataset: green, variable: B03}
