# The GeoLoupe gallery: open Earth data read live from public archives (nothing is downloaded
# in advance, no account or key is needed).
#
#   geoloupe gallery                 # serve it
#   geoloupe gallery --show-config   # print this file, to copy and change it
#
# Opening takes ~10 s (remote metadata); tiles take 0.3–1.5 s each over the internet.
title: GeoLoupe gallery
description: >-
  Open Earth data, read live from public cloud archives: hourly weather since 1940 (ERA5),
  Sentinel-2 satellite images, a 30 m elevation model, ESA WorldCover land cover, NOAA
  weather stations, a CMIP6 climate model's ocean on its own grid, and regions, rivers and lakes as
  overlays. Nothing is copied in advance. Pick a view to start, or explore freely:
  every map shows the values under the cursor, and a click gives the time series.

datasets:
  era5:
    title: ERA5 hourly reanalysis, 0.25° (ARCO-ERA5)
    description: ECMWF's global reanalysis of the atmosphere, land and ocean, hour by hour since 1940.
    path: https://storage.googleapis.com/gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
    variables:
      - 2m_temperature
      - total_precipitation
      - total_column_water_vapour
      - instantaneous_10m_wind_gust
      - sea_surface_temperature
      - geopotential_at_surface
    # The store's time axis runs 1900–2050; data exists from 1940 to about one week ago.
    time_range: ["1940-01-01", "2026-10-30"]
    decode:
      geopotential_at_surface: {scale: 0.10197162}  # geopotential / g = height (m)
    styles:
      geopotential_at_surface: {title: Surface height (ERA5 orography), units: m, colormap: terrain}
    attribution: ERA5 © ECMWF / Copernicus Climate Change Service; ARCO-ERA5 by Google Research

  dem:
    title: Copernicus DEM GLO-30 (30 m), Western Alps
    description: Surface elevation from the TanDEM-X mission; six 1° × 1° Cloud-Optimized GeoTIFFs.
    mosaic:
      - https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N45_00_E006_00_DEM/Copernicus_DSM_COG_10_N45_00_E006_00_DEM.tif
      - https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N45_00_E007_00_DEM/Copernicus_DSM_COG_10_N45_00_E007_00_DEM.tif
      - https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N45_00_E008_00_DEM/Copernicus_DSM_COG_10_N45_00_E008_00_DEM.tif
      - https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N46_00_E006_00_DEM/Copernicus_DSM_COG_10_N46_00_E006_00_DEM.tif
      - https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N46_00_E007_00_DEM/Copernicus_DSM_COG_10_N46_00_E007_00_DEM.tif
      - https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N46_00_E008_00_DEM/Copernicus_DSM_COG_10_N46_00_E008_00_DEM.tif
    variable_name: elevation
    styles:
      elevation: {units: m, colormap: terrain}
    attribution: Copernicus DEM GLO-30 © DLR e.V. 2010–2014 and © Airbus Defence and Space GmbH 2014–2018, provided under COPERNICUS by the EU and ESA

  landcover:
    title: ESA WorldCover 2021 (10 m), 45–48° N, 6–9° E
    description: Global land cover at 10 m from Sentinel-1 and Sentinel-2, eleven classes.
    path: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N45E006_Map.tif
    variable_name: landcover
    styles:
      landcover:
        title: Land cover (ESA WorldCover 2021)
        classes:  # colours come from the file's palette
          10: {name: Tree cover}
          20: {name: Shrubland}
          30: {name: Grassland}
          40: {name: Cropland}
          50: {name: Built-up}
          60: {name: Bare / sparse vegetation}
          70: {name: Snow and ice}
          80: {name: Permanent water bodies}
          90: {name: Herbaceous wetland}
          95: {name: Mangroves}
          100: {name: Moss and lichen}
    attribution: © ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by the ESA WorldCover consortium (CC BY 4.0)

  # Sentinel-2 L2A found with a STAC search of Element84's Earth Search: the 10 least cloudy
  # scenes of August 2023 over the Western Alps, one mosaic per band. Element84's files have the
  # BOA offset applied already; GeoLoupe reads that from the items (reflectance = DN × 0.0001).
  s2:
    title: Sentinel-2 L2A, Western Alps, August 2023
    description: The least cloudy scenes of the month, found with a STAC search and shown as one mosaic.
    stac:
      url: https://earth-search.aws.element84.com/v1
      collections: [sentinel-2-l2a]
      bbox: [6.8, 45.6, 8.8, 46.6]
      datetime: 2023-08-01/2023-08-31
      query: {"eo:cloud_cover": {"lt": 5}}
      limit: 10
      assets: [visual, red, green, nir]
    styles:
      red: {colormap: gray, vmin: 0, vmax: 0.3, units: reflectance}
      green: {colormap: gray, vmin: 0, vmax: 0.3, units: reflectance}
      nir: {colormap: gray, vmin: 0, vmax: 0.5, units: reflectance}
    attribution: Contains modified Copernicus Sentinel data 2023 (ESA); COGs and STAC API by Element84

  # A climate model's ocean on its native tripolar grid (2-D longitude/latitude per cell), from
  # the Pangeo CMIP6 archive on Google Cloud. Monthly means, 1850–2014.
  ocean-model:
    title: GFDL-ESM4 climate model ocean (CMIP6 historical)
    description: NOAA-GFDL's Earth system model, sea surface temperature on its native 0.5° tripolar ocean grid.
    path: https://storage.googleapis.com/cmip6/CMIP6/CMIP/NOAA-GFDL/GFDL-ESM4/historical/r1i1p1f1/Omon/tos/gn/v20190726
    variables: [tos]
    styles:
      tos: {title: Sea surface temperature (GFDL-ESM4 model), colormap: thermal, vmin: -2, vmax: 32, units: °C}
    attribution: GFDL-ESM4 CMIP6 historical r1i1p1f1 (Krasting et al. 2018, CC BY 4.0); Pangeo CMIP6 on Google Cloud

layers:
  temperature:
    title: Air temperature at 2 m
    units: °C
    colormap: RdYlBu_r
    sources:
      - {dataset: era5, variable: 2m_temperature, offset: -273.15}
  precipitation:
    title: Precipitation (hourly)
    units: mm/h
    colormap: YlGnBu
    vmin: 0
    vmax: 8
    sources:
      - {dataset: era5, variable: total_precipitation, scale: 1000}
  water-vapour:
    title: Water vapour in the air column
    units: mm
    colormap: dense
    vmin: 0
    vmax: 60
    sources:
      - {dataset: era5, variable: total_column_water_vapour}
  wind-gust:
    title: Wind gusts at 10 m
    units: m/s
    colormap: speed
    vmin: 0
    vmax: 40
    sources:
      - {dataset: era5, variable: instantaneous_10m_wind_gust}
  sea-temperature:
    title: Sea surface temperature
    units: °C
    colormap: thermal
    vmin: -2
    vmax: 32
    sources:
      - {dataset: era5, variable: sea_surface_temperature, offset: -273.15}
  elevation:
    title: Elevation (30 m in the Alps, 31 km elsewhere)
    description: Copernicus DEM where it exists, ERA5's smooth model orography everywhere else.
    units: m
    colormap: terrain
    vmin: 0
    vmax: 4500
    sources:
      - {dataset: dem, variable: elevation}
      - {dataset: era5, variable: geopotential_at_surface, time: "1940-01-01T00:00"}
  false-colour:
    title: Sentinel-2 false colour (vegetation in red)
    rgb: true
    gamma: 1.3
    vmin: 0
    vmax: 0.45
    sources:
      - {dataset: s2, variable: nir}
      - {dataset: s2, variable: red}
      - {dataset: s2, variable: green}

points:
  ghcn:
    title: GHCN-Daily weather stations (NOAA NCEI)
    attribution: NOAA NCEI, Global Historical Climatology Network – Daily (Menne et al. 2012)
    # One CSV per station from NCEI's "access" folder: Swiss stations and long records worldwide.
    path:
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/SZ000001940.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/SZ000002220.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/SZ000003700.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/SZ000006717.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/SZ000008440.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/SZ000009480.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/SZE00105086.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/SZE00116090.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/GM000004204.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/ITE00100554.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/AU000005901.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/NLM00006260.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/UK000056225.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/SP000003195.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/IC000004030.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/USW00094728.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/BR00E3-0520.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/IN022021900.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/CHM00054511.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/JA000047662.csv
      - https://www.ncei.noaa.gov/data/global-historical-climatology-network-daily/access/ASN00066062.csv
    variables:  # NCEI stores tenths of °C and tenths of mm; only these columns are read
      TMAX: {scale: 0.1, units: °C}
      TMIN: {scale: 0.1, units: °C}
      PRCP: {scale: 0.1, units: mm}

vectors:  # overlays (Natural Earth 5.1.2, public domain); switch them on in the layer panel
  regions:
    title: States and provinces
    path: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_1_states_provinces.geojson
    properties: [name, admin, type_en]
    simplify: 0.02  # ≈ 2 km: 6 MB instead of 41 MB
    color: "#3d3d3d"
    width: 0.8
    attribution: Natural Earth
  rivers:
    title: Rivers
    path: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_rivers_lake_centerlines.geojson
    properties: [name, scalerank]
    color: "#1f6fb5"
    width: 1.3
    attribution: Natural Earth
  lakes:
    title: Lakes
    path: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_lakes.geojson
    properties: [name]
    color: "#1f6fb5"
    fill: "#1f6fb5"
    fill_opacity: 0.35
    attribution: Natural Earth

views:
  - title: The whole planet, one hour
    description: Air temperature on 15 January 2024 at 12 UTC. Drag the globe; the time bar steps hour by hour back to 1940.
    layer: temperature
    time: "2024-01-15T12:00"
    center: [10, 25]
    zoom: 1.4
    globe: true
    vmin: -45
    vmax: 40
  - title: Europe's heatwave, July 2023
    description: Afternoon temperatures above 40 °C in Sardinia, Sicily and Greece on 18 July 2023. Hover a region for its name.
    layer: temperature
    time: "2023-07-18T14:00"
    center: [14, 42]
    zoom: 3.6
    vmin: 5
    vmax: 45
    vectors: [regions]
  - title: Hurricane Ian reaches Florida
    description: Wind gusts on 28 September 2022 at 18 UTC, as the storm makes landfall.
    layer: wind-gust
    time: "2022-09-28T18:00"
    center: [-82, 26.5]
    zoom: 4.8
    vmin: 0
    vmax: 50
    basemap: dark
  - title: Atmospheric rivers over the Pacific
    description: Long bands of water vapour that brought floods to California on 9 January 2023.
    layer: water-vapour
    time: "2023-01-09T12:00"
    center: [-145, 33]
    zoom: 2.7
  - title: The Gulf Stream
    description: Warm water along the US coast and across the Atlantic, 15 August 2023.
    layer: sea-temperature
    time: "2023-08-15T12:00"
    center: [-58, 38]
    zoom: 3.4
    vmin: 5
    vmax: 31
  - title: Storm Ciarán reaches Europe
    description: The rain bands of a deep Atlantic cyclone wind around its centre, 2 November 2023 at 00 UTC.
    layer: precipitation
    time: "2023-11-02T00:00"
    center: [-5, 48.5]
    zoom: 4.4
    vmin: 0
    vmax: 3
  - title: A climate model's ocean, on its own grid
    description: Sea surface temperature in the GFDL-ESM4 model, August 2014, drawn on the model's curvilinear (tripolar) grid. Click for the 165-year monthly series.
    layer: ocean-model:tos
    time: "2014-08-16T12:00"
    center: [-40, 45]
    zoom: 2.3
  - title: 165 years of ocean warming in a model
    description: August 2014 minus August 1850 in the same historical simulation (one month each, so weather-like noise remains).
    layer: ocean-model:tos
    time: "2014-08-16T12:00"
    compare: ocean-model:tos
    compare_time: "1850-08-16T12:00"
    compare_mode: diff
    center: [-20, 30]
    zoom: 1.6
  - title: From 31 km to 30 m
    description: The Matterhorn in the Copernicus DEM. Zoom out to see ERA5's coarse orography take over outside the Alps.
    layer: elevation
    center: [7.66, 45.98]
    zoom: 10.5
    vmin: 1000
    vmax: 4500
  - title: The Western Alps from space
    description: Sentinel-2 in real colour (10 m) from Mont Blanc to Lake Maggiore, a mosaic of the least cloudy scenes of August 2023 found with a STAC search.
    layer: s2:visual:rgb
    center: [7.45, 45.95]
    zoom: 8.6
  - title: True vs false colour
    description: The same scene with near infrared as red (healthy vegetation is bright red). Drag the divider.
    layer: s2:visual:rgb
    compare: false-colour
    center: [8.46, 45.86]
    zoom: 10.6
  - title: Land cover around Lake Geneva
    description: ESA WorldCover classes at 10 m; hover for the class name, the legend shows each class's share.
    layer: landcover:landcover
    center: [6.6, 46.42]
    zoom: 10
  - title: Weather stations since 1763
    description: Daily maximum temperature on 18 July 2023 at long-running NOAA GHCN stations. Click one for its whole record; Milan's starts in 1763.
    layer: ghcn:TMAX
    time: "2023-07-18"
    center: [6, 49]
    zoom: 3.7
